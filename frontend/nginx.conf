server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index pages/index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend Multi-Page Application (MPA) Routing
    location = / {
        try_files /pages/index.html =404;
    }

    location = /login {
        try_files /pages/login.html =404;
    }

    location = /register {
        try_files /pages/register.html =404;
    }

    location = /report {
        try_files /pages/report.html =404;
    }

    location = /detail {
        try_files /pages/detail.html =404;
    }

    location = /admin {
        try_files /pages/admin.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /pages/index.html;
    }

    # Reverse proxy ke REST API backend
    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy ke penyimpanan gambar publik backend
    location /storage/ {
        proxy_pass http://backend:80/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/pages;
    }
}
