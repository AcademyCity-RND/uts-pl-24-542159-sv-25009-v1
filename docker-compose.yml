services:
  database:
    image: mysql:8.0
    container_name: jejakbarang_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jejakbarang_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jejakbarang-backend:1.0.0
    container_name: jejakbarang_backend
    restart: unless-stopped
    ports:
      - "${BE_PORT:-8000}:80"
    environment:
      APP_NAME: JejakBarang
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${BE_PORT:-8000}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi}
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      CACHE_STORE: file
      SESSION_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - backend_storage:/app/storage/app/public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jejakbarang_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: jejakbarang-frontend:1.0.0
    container_name: jejakbarang_frontend
    restart: unless-stopped
    ports:
      - "${FE_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jejakbarang_network

  # =========================================================================
  # Layanan Observabilitas & Pemantauan (Praktikum 11 - Prometheus & Grafana)
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jejakbarang_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - jejakbarang_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: jejakbarang_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-SandiAdminGrafana2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - jejakbarang_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: jejakbarang_cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    ports:
      - "8080:8080"
    networks:
      - jejakbarang_network

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: jejakbarang_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - jejakbarang_network

networks:
  jejakbarang_network:
    driver: bridge

volumes:
  db_data:
  backend_storage:
  prom_data:
  grafana_data:
