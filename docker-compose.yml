services:
  database:
    image: mysql:8.0
    container_name: jejakbarang_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jejakbarang_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jejakbarang-backend:1.0.0
    container_name: jejakbarang_backend
    restart: unless-stopped
    ports:
      - "${BE_PORT:-8000}:80"
    environment:
      APP_NAME: JejakBarang
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${BE_PORT:-8000}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi}
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - backend_storage:/app/storage/app/public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jejakbarang_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: jejakbarang-frontend:1.0.0
    container_name: jejakbarang_frontend
    restart: unless-stopped
    ports:
      - "${FE_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jejakbarang_network

networks:
  jejakbarang_network:
    driver: bridge

volumes:
  db_data:
  backend_storage:
